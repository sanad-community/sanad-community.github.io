<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الفريق | SANAD Team</title>
  <meta name="description" content="فريق متطوّعي سند. The volunteers behind SANAD.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="images/brand/logo-mark.svg">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved light/dark choice before the page paints; otherwise follow the system setting.
    try { const t = localStorage.getItem("sanad-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="brand" aria-label="SANAD">
        <img class="brand-logo" src="images/brand/logo-mark.svg" alt="" width="34" height="42">
        <span class="brand-name">سند <span class="brand-latin">SANAD</span></span>
      </a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="nav" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav" class="nav">
        <a href="index.html#about" data-t="navAbout"></a>
        <a href="index.html#communities" data-t="navCommunities"></a>
        <a href="programs.html" data-t="navPrograms"></a>
        <a href="team.html" aria-current="page" data-t="navTeam"></a>
        <a href="index.html#faq" data-t="navFaq"></a>
        <a href="#find-us" data-t="navFindUs"></a>
        <a href="index.html#join" class="nav-cta" data-t="navJoin"></a>
        <button class="lang" type="button" data-t="langSwitch"></button>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker" data-t="teamKicker"></p>
        <h1 data-t="teamPageTitle"></h1>
        <p class="lead narrow" data-t="teamPageText"></p>
        <nav class="jump" id="teamJump" aria-label="Teams"></nav>
        <div id="founder" class="members"></div>
      </div>
    </section>

    <section class="section team-groups-section">
      <div class="wrap" id="teamGroups"></div>
    </section>

    <section class="section join">
      <div class="wrap">
        <div class="join-card">
          <h2 data-t="teamJoinTitle"></h2>
          <p data-t="teamJoinText"></p>
          <div class="actions" id="volunteerActions"></div>
        </div>
      </div>
    </section>
    <section id="find-us" class="section find-us">
      <div class="wrap">
        <h2 data-t="findUsTitle"></h2>
        <p class="muted" data-t="findUsText"></p>
        <div class="find-grid" id="findUs"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <img class="footer-logo" src="images/brand/logo.svg" alt="مجتمع سند للباحثات والباحثين — SANAD">
        <p class="muted" data-t="footerTagline"></p>
        <p class="muted" data-t="footerPartners"></p>
      </div>
      <div class="social" id="social"></div>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
