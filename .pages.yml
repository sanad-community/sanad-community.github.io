# Pages CMS configuration: https://pagescms.org/docs
# Admins edit the files in data/ through forms at https://app.pagescms.org
media:
  input: "images"
  output: "images"
content:
  - name: "team"
    label: "الفريق / Team"
    type: "file"
    path: "data/team.json"
    fields:
      - name: "founder"
        label: "المؤسس / Founder"
        type: "object"
        fields:
          - name: "name"
            label: "الاسم / Name"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "role"
            label: "الدور (اختياري) / Role"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
            description: "مثلًا: مسؤولة المحتوى"
          - name: "affiliation"
            label: "الجامعة / University"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
            description: "الاسم الكامل، مثلًا: الجامعة العبرية في القدس / Hebrew University of Jerusalem"
          - name: "photo"
            label: "صورة / Photo"
            type: "image"
            description: "صورة مربّعة، 400×400 على الأقل"
          - name: "link"
            label: "رابط لينكدإن أو موقع شخصي / LinkedIn or website"
            type: "string"
      - name: "teams"
        label: "الفرق / Teams"
        type: "object"
        fields:
          - name: "id"
            label: "معرّف / ID"
            type: "string"
            description: "بالإنجليزية وبدون مسافات، مثلًا: meetups"
          - name: "name"
            label: "اسم الفريق / Team name"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "text"
            label: "وصف قصير / Short description"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "text"
              - name: "en"
                label: "English"
                type: "text"
          - name: "lead"
            label: "منسّق/ة الفريق / Team lead"
            type: "object"
            fields:
              - name: "name"
                label: "الاسم / Name"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
              - name: "role"
                label: "الدور (اختياري) / Role"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
                description: "مثلًا: مسؤولة المحتوى"
              - name: "affiliation"
                label: "الجامعة / University"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
                description: "الاسم الكامل، مثلًا: الجامعة العبرية في القدس / Hebrew University of Jerusalem"
              - name: "photo"
                label: "صورة / Photo"
                type: "image"
                description: "صورة مربّعة، 400×400 على الأقل"
              - name: "link"
                label: "رابط لينكدإن أو موقع شخصي / LinkedIn or website"
                type: "string"
            description: "اتركوه فارغًا إن لم يكن هناك منسّق/ة"
          - name: "members"
            label: "الأعضاء / Members"
            type: "object"
            fields:
              - name: "name"
                label: "الاسم / Name"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
              - name: "role"
                label: "الدور (اختياري) / Role"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
                description: "مثلًا: مسؤولة المحتوى"
              - name: "affiliation"
                label: "الجامعة / University"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
                description: "الاسم الكامل، مثلًا: الجامعة العبرية في القدس / Hebrew University of Jerusalem"
              - name: "photo"
                label: "صورة / Photo"
                type: "image"
                description: "صورة مربّعة، 400×400 على الأقل"
              - name: "link"
                label: "رابط لينكدإن أو موقع شخصي / LinkedIn or website"
                type: "string"
            list: true
        list: true
      - name: "pastVolunteers"
        label: "متطوّعون سابقون / Past volunteers"
        type: "object"
        fields:
          - name: "name"
            label: "الاسم / Name"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "team"
            label: "الفريق (اختياري) / Team"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
        list: true
  - name: "programs"
    label: "المبادرات / Programs"
    type: "file"
    path: "data/programs.json"
    fields:
      - name: "programs"
        label: "المبادرات / Programs"
        type: "object"
        fields:
          - name: "id"
            label: "معرّف / ID"
            type: "string"
            description: "يظهر في الرابط program.html?p=… — بالإنجليزية وبدون مسافات"
          - name: "status"
            label: "الحالة / Status"
            type: "select"
            options:
              values:
                - "active"
                - "forming"
                - "planned"
            description: "active = فعّال، forming = قيد التطوير، planned = مخطّط"
          - name: "icon"
            label: "أيقونة / Icon"
            type: "select"
            options:
              values:
                - "community"
                - "mentor"
                - "network"
                - "growth"
                - "spotlight"
                - "handshake"
                - "directory"
                - "gathering"
          - name: "name"
            label: "الاسم / Name"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "text"
            label: "نص البطاقة / Card text"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "text"
              - name: "en"
                label: "English"
                type: "text"
          - name: "intro"
            label: "مقدّمة صفحة المبادرة / Page intro"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "text"
              - name: "en"
                label: "English"
                type: "text"
          - name: "announcements"
            label: "إعلانات بارزة / Highlighted announcements"
            type: "object"
            fields:
              - name: "badge"
                label: "شارة / Badge"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
                description: "مثلًا: التسجيل مفتوح"
              - name: "title"
                label: "العنوان / Title"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
              - name: "text"
                label: "النص / Text"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "text"
                  - name: "en"
                    label: "English"
                    type: "text"
              - name: "link"
                label: "رابط الزر / Button link"
                type: "string"
              - name: "label"
                label: "نص الزر / Button text"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
              - name: "embed"
                label: "رابط النموذج للعرض داخل الموقع (اختياري) / Embedded form link"
                type: "string"
                description: "رابط Google Form الكامل الذي ينتهي بـ viewform?embedded=true"
              - name: "poster"
                label: "بوستر / Poster"
                type: "image"
            list: true
            description: "الإعلان الأول يظهر أيضًا في النافذة المنبثقة على الصفحة الرئيسية"
          - name: "gallery"
            label: "معرض صور / Photo gallery"
            type: "image"
            list: true
          - name: "sections"
            label: "قوائم / Lists"
            type: "object"
            fields:
              - name: "title"
                label: "العنوان / Title"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
              - name: "items"
                label: "البنود / Items"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
                list: true
            list: true
          - name: "showCommunities"
            label: "عرض قائمة الجامعات / Show universities"
            type: "boolean"
          - name: "showVideos"
            label: "عرض فيديوهات باحث تحت المجهر / Show videos"
            type: "boolean"
          - name: "team"
            label: "الفريق المسؤول (معرّف) / Team ID"
            type: "string"
            description: "مثلًا: mentorship — اتركوه فارغًا إن لم يوجد"
          - name: "cta"
            label: "صندوق الختام / Closing box"
            type: "select"
            options:
              values:
                - "join"
                - "contact"
            description: "join = زر التسجيل في المجتمع، contact = إنستغرام والبريد"
          - name: "ctaTitle"
            label: "عنوان صندوق الختام (اختياري) / Closing title"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "ctaText"
            label: "نص صندوق الختام (اختياري) / Closing text"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "text"
              - name: "en"
                label: "English"
                type: "text"
          - name: "ctaLink"
            label: "زر خاص في صندوق الختام (اختياري) / Custom closing button"
            type: "object"
            fields:
              - name: "href"
                label: "الرابط / Link"
                type: "string"
              - name: "label"
                label: "نص الزر / Button text"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
        list: true
  - name: "spotlight"
    label: "باحث تحت المجهر / Videos"
    type: "file"
    path: "data/spotlight.json"
    fields:
      - name: "videos"
        label: "الفيديوهات / Videos"
        type: "object"
        fields:
          - name: "video"
            label: "رابط الفيديو / Video link"
            type: "string"
            description: "رابط ريل إنستغرام أو فيديو يوتيوب"
          - name: "name"
            label: "اسم الباحث/ة (اختياري) / Name"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "field"
            label: "المجال (اختياري) / Field"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "affiliation"
            label: "الجامعة (اختياري) / University"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
        list: true
        description: "الترتيب هنا هو ترتيب الحلقات"
  - name: "faq"
    label: "أسئلة شائعة / FAQ"
    type: "file"
    path: "data/faq.json"
    fields:
      - name: "faq"
        label: "الأسئلة / Questions"
        type: "object"
        fields:
          - name: "q"
            label: "السؤال / Question"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "a"
            label: "الجواب / Answer"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "text"
              - name: "en"
                label: "English"
                type: "text"
          - name: "link"
            label: "رابط (اختياري) / Link"
            type: "object"
            fields:
              - name: "href"
                label: "الرابط / Link"
                type: "string"
                description: "اكتبوا joinForm لرابط نموذج التسجيل"
              - name: "label"
                label: "نص الرابط / Link text"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
        list: true
  - name: "forms"
    label: "النماذج: ترجمات ونصوص / Forms: translations & texts"
    type: "file"
    path: "data/forms/i18n.json"
    fields:
      - name: "forms"
        label: "النماذج / Forms"
        type: "object"
        list: true
        description: "الأسئلة نفسها تُقرأ تلقائيًا من Google Forms كل يوم. هنا فقط الترجمة الإنجليزية ونصوص الصفحة."
        fields:
          - name: "key"
            label: "معرّف / Key"
            type: "string"
            description: "join / mentee / mentor"
          - name: "kicker"
            label: "عنوان صغير / Kicker"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "title"
            label: "عنوان الصفحة / Page title"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "intro"
            label: "مقدّمة / Intro"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "text"
              - name: "en"
                label: "English"
                type: "text"
          - name: "done"
            label: "رسالة الشكر / Thank-you message"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "text"
              - name: "en"
                label: "English"
                type: "text"
          - name: "groups"
            label: "عناوين الأقسام / Section titles"
            type: "object"
            list: true
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "fields"
            label: "الأسئلة / Questions"
            type: "object"
            list: true
            description: "ترجمة إنجليزية لكل سؤال حسب رقمه (id). سؤال بلا ترجمة يظهر بالعربية."
            fields:
              - name: "id"
                label: "رقم السؤال / Question ID"
                type: "string"
              - name: "en"
                label: "السؤال بالإنجليزية / English label"
                type: "string"
              - name: "hint"
                label: "توضيح (اختياري) / Hint"
                type: "object"
                fields:
                  - name: "ar"
                    label: "عربي"
                    type: "text"
                  - name: "en"
                    label: "English"
                    type: "text"
              - name: "options"
                label: "الخيارات / Options"
                type: "object"
                list: true
                fields:
                  - name: "value"
                    label: "الخيار كما في Google / Value in Google Forms"
                    type: "string"
                  - name: "en"
                    label: "English"
                    type: "string"
                  - name: "ar"
                    label: "عربي معدّل (اختياري) / Arabic display"
                    type: "string"
              - name: "showIf"
                label: "يظهر فقط إذا… (اختياري) / Show only if"
                type: "object"
                fields:
                  - name: "id"
                    label: "رقم السؤال / Question ID"
                    type: "string"
                  - name: "value"
                    label: "الجواب / Answer"
                    type: "string"
              - name: "wide"
                label: "بعرض كامل / Full width"
                type: "boolean"
  - name: "communities"
    label: "الجامعات / Universities"
    type: "file"
    path: "data/communities.json"
    fields:
      - name: "communities"
        label: "الجامعات / Universities"
        type: "object"
        fields:
          - name: "name"
            label: "الاسم الكامل / Full name"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "short"
            label: "اسم مختصر / Short name"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
            description: "يظهر في بطاقات الأعضاء، مثلًا: الجامعة العبرية / HUJI"
          - name: "status"
            label: "الحالة / Status"
            type: "select"
            options:
              values:
                - "active"
                - "forming"
                - "planned"
        list: true
  - name: "home"
    label: "من نحن / About"
    type: "file"
    path: "data/home.json"
    fields:
      - name: "audience"
        label: "لمن سند؟ / Who is SANAD for"
        type: "object"
        fields:
          - name: "ar"
            label: "عربي"
            type: "string"
          - name: "en"
            label: "English"
            type: "string"
        list: true
      - name: "values"
        label: "القيم / Values"
        type: "object"
        fields:
          - name: "name"
            label: "القيمة / Value"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
          - name: "text"
            label: "الشرح / Text"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
                label: "English"
                type: "string"
        list: true
  - name: "site"
    label: "روابط وإعدادات / Links & settings"
    type: "file"
    path: "data/site.json"
    fields:
      - name: "links"
        label: "الروابط / Links"
        type: "object"
        fields:
          - name: "instagram"
            label: "Instagram"
            type: "string"
          - name: "linkedin"
            label: "LinkedIn"
            type: "string"
          - name: "youtube"
            label: "YouTube"
            type: "string"
          - name: "joinForm"
            label: "نموذج التسجيل / Join form"
            type: "string"
          - name: "whatsapp"
            label: "WhatsApp"
            type: "string"
          - name: "volunteerForm"
            label: "نموذج التطوّع / Volunteer form"
            type: "string"
          - name: "email"
            label: "البريد / Email"
            type: "string"
      - name: "popup"
        label: "النافذة المنبثقة في الصفحة الرئيسية / Homepage popup"
        type: "object"
        fields:
          - name: "enabled"
            label: "مفعّلة / Enabled"
            type: "boolean"
          - name: "program"
            label: "المبادرة (معرّف) / Program ID"
            type: "string"
            description: "تعرض الإعلان الأول لهذه المبادرة، مثلًا: mentorship"
          - name: "delaySeconds"
            label: "بعد كم ثانية تظهر / Delay (seconds)"
            type: "number"
          - name: "maxShows"
            label: "عدد مرات الظهور لكل زائر / Times shown per visitor"
            type: "number"
  - name: "news"
    label: "الأخبار (مخفية حاليًا) / News (hidden)"
    type: "file"
    path: "data/news.json"
    fields:
      - name: "news"
        label: "الأخبار / News"
        type: "object"
        fields:
          - name: "icon"
            label: "أيقونة / Icon"
            type: "select"
            options:
              values:
                - "community"
                - "mentor"
                - "network"
                - "growth"
                - "spotlight"
                - "handshake"
                - "directory"
                - "gathering"
          - name: "tag"
            label: "تصنيف / Tag"
            type: "object"
            fields:
              - name: "ar"
                label: "عربي"
                type: "string"
              - name: "en"
